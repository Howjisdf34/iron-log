name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironlog
          POSTGRES_PASSWORD: ironlog
          POSTGRES_DB: ironlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ironlog:ironlog@localhost:5432/ironlog
      AUTH_SECRET: ci-only-secret-not-for-production
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # Sin `version:` acá a propósito — pnpm/action-setup@v4 la toma del
      # campo "packageManager" de package.json (pnpm@11.22.0). Pisarla acá
      # con otra versión hace que la action falle con
      # ERR_PNPM_BAD_PM_VERSION (bug real, encontrado en el primer run de
      # este workflow — ver ADR-026 en docs/ARCHITECTURE.md).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `LayoutProps`/`PageProps` son tipos ambiente que Next genera en
      # .next/types/ (ver tsconfig.json `include`) — sólo existen después
      # de un build o typegen. En local siempre había un .next/ de un
      # `pnpm dev`/`build` previo, así que esto nunca se notó hasta el
      # primer checkout limpio de verdad en CI (bug real — ver ADR-027).
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - name: Bundle budget del Workout Player
        run: pnpm exec tsx scripts/check-bundle-budget.ts

  # Build en CI, no en el VPS (CLAUDE.md §8.6, opción b): un build de Next
  # en un VPS de 2 vCPU puede tumbarlo. Coolify sólo hace `pull` de esta
  # imagen — ver docs/DEPLOY.md.
  docker-publish:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags/labels, minúsculas obligatorias para GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
